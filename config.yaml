# server config
servers:
  - open-port: 9090
    tunnel-port: 8080

# client config
clients:
  - tunnel-addr: 0.0.0.0:8080
    local-port: 7070

# log file config
log:
  path: ./logs
  # maximum size of a single file
  size: 1
  # number of days to retain
  age: 30
  # maximum number of backup files
  backups: 1000